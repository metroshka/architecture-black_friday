name: mongo-sharding

services:
  config-srv:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: configSrv
    command:
      - mongod
      - --configsvr
      - --replSet
      - configReplSet
      - --port
      - "27019"
      - --bind_ip_all
    volumes:
      - configsrv_data:/data/db

  shard1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1ReplSet
      - --port
      - "27018"
      - --bind_ip_all
    volumes:
      - shard1_data:/data/db

  shard2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2ReplSet
      - --port
      - "27018"
      - --bind_ip_all
    volumes:
      - shard2_data:/data/db

  mongos:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos
    depends_on:
      - config-srv
      - shard1
      - shard2
    command:
      - mongos
      - --configdb
      - configReplSet/config-srv:27019
      - --port
      - "27017"
      - --bind_ip_all
    restart: unless-stopped

  pymongo-api:
    image: kazhem/pymongo_api:1.0.0
    container_name: pymongo-api
    depends_on:
      - mongos
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  configsrv_data:
  shard1_data:
  shard2_data: